<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- Fondo teal -->
  <rect width="1080" height="1080" fill="#79C8D0"/>

  <!-- Patrón de lunares sutil -->
  <defs>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="3" fill="#ffffff" opacity="0.25"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="url(#dots)"/>

  <!-- LOCKUP HORIZONTAL centrado arriba -->
  <!-- Isotipo a tamaño pequeño 120x63 -->
  <image x="360" y="125" width="120" height="63" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
  <!-- Wordmark alineado verticalmente con centro del isotipo -->
  <text x="500" y="175" font-family="Ubuntu, sans-serif" font-weight="700" font-size="38" fill="#ffffff" letter-spacing="-1">Parche Peludo</text>

  <!-- Titular principal con espacio amplio -->
  <g font-family="Ubuntu, sans-serif" font-weight="700" fill="#ffffff" letter-spacing="-2">
    <text x="540" y="470" text-anchor="middle" font-size="64">Para los que aman</text>
    <text x="540" y="550" text-anchor="middle" font-size="64">de verdad a sus</text>
    <text x="540" y="630" text-anchor="middle" font-size="64">peludos.</text>
  </g>

  <!-- Pill inferior con URL -->
  <g transform="translate(340, 750)">
    <rect width="400" height="70" rx="35" fill="#ffffff"/>
    <text x="200" y="46" text-anchor="middle" font-family="Ubuntu, sans-serif" font-weight="700" font-size="22" fill="#1E5D64">parchepeludo.com</text>
  </g>

  <!-- Microcopy inferior -->
  <text x="540" y="930" text-anchor="middle" font-family="Ubuntu, sans-serif" font-weight="500" font-size="14" fill="#ffffff" letter-spacing="3" opacity="0.85">UN PORCENTAJE DE CADA RESERVA VA A CAUSAS PET</text>
  <text x="540" y="980" text-anchor="middle" font-family="Ubuntu, sans-serif" font-weight="500" font-size="14" fill="#ffffff" letter-spacing="6" opacity="0.7">#ELPARCHE</text>
</svg>