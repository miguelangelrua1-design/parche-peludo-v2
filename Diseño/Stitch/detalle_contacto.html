<script>
        // Micro-interactions and subtle haptics simulation
        document.querySelectorAll('button, a').forEach(element => {
            element.addEventListener('click', () => {
                // Future implementation: Subtle browser haptic feedback if supported
                if (window.navigator && window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });

        // Add a simple fade-in entrance for the list items
        const observerOptions = {
            threshold: 0.1
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('opacity-100', 'translate-y-0');
                        entry.target.classList.remove('opacity-0', 'translate-y-4');
                    }, index * 80);
                }
            });
        }, observerOptions);

        document.querySelectorAll('.tap-scale').forEach(item => {
            item.classList.add('opacity-0', 'translate-y-4', 'transition-all', 'duration-500', 'ease-out');
            observer.observe(item);
        });
    </script>
