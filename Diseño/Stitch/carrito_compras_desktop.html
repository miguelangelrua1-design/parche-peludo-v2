<!DOCTYPE html><html class="light" lang="es" style="width: 1280px; height: 1150px; overflow: hidden; position: relative;"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Carrito de Compras | Parche Peludo</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Ubuntu & Caveat -->
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,700&amp;family=Caveat:wght@400;500;600;700&amp;family=Public+Sans:wght@400;600;700;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        'teal-parche': '#79C8D0',
                        'teal-deep': '#4AA5AD',
                        'teal-soft': '#BEE3E7',
                        'teal-mist': '#E8F4F6',
                        'teal-ink': '#1E5D64',
                        'ink': '#1E2E33',
                        'ink-muted': '#5A6B70',
                        'ink-faint': '#8E9A9E',
                        'paper': '#FFFFFF',
                        'bone': '#F7F3EC',
                        'coral': '#E85D75',
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1.25rem", // --r-lg: 20px
                        "xl": "1.75rem", // --r-xl: 28px
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Ubuntu", "sans-serif"],
                        "display": ["Ubuntu", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Ubuntu", "sans-serif"],
                        "hand": ["Caveat", "cursive"]
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FFFFFF;
            color: #1E2E33;
        }
        h1, h2, h3, .font-ubuntu {
            font-family: 'Ubuntu', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- TopNavBar -->

<!-- Main Content: Cart Page -->
<main class="flex-grow pt-32 pb-24 px-6 max-w-[1200px] mx-auto w-full">
<!-- Breadcrumbs & Header -->
<div class="mb-10">
<nav class="flex items-center gap-2 text-ink-faint text-sm mb-4">
<a class="hover:text-teal-deep" href="#">Parche Peludo</a>
<span class="material-symbols-outlined text-xs">chevron_right</span>
<span class="text-ink">Cart</span>
</nav>
<h1 class="text-5xl font-[900] text-ink tracking-tight">Carrito de compras</h1>
</div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-10 items-start">
  <!-- Left Column: Products & Actions (8/12 columns) -->
  <div class="md:col-span-8 space-y-10">
    <!-- Table Section -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse">
        <thead>
          <tr class="border-b border-ink-line text-sm font-bold text-ink-muted uppercase tracking-widest">
            <th class="pb-4 pt-0 w-20"></th>
            <th class="pb-4 pt-0">Producto</th>
            <th class="pb-4 pt-0 text-center px-4">Precio</th>
            <th class="pb-4 pt-0 text-center px-4">Cantidad</th>
            <th class="pb-4 pt-0 text-center px-4">Total</th>
            
          </tr>
        </thead>
        <tbody class="divide-y divide-ink-line-2">
          <tr class="group transition-colors hover:bg-teal-mist/30">
            <td class="py-6 pr-6">
              <div class="w-20 h-20 rounded-lg overflow-hidden bg-teal-mist border border-ink-line-2">
                <img alt="Producto" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLs7VFE26zdb_xWJdCosvLQat8rHdc9aIRADsKuCZ7vQBrfDuhHTi6VGs1UgU5AZtqG1f53BXzyyyZhmxh78BNQHxEa9GY0SEMCt4yf4ojA4L9_MV4JmEXRDIpkgr7HXWKOttI3835uoW4r7L3Lq3TcoNUBrf-pZZsBef13CDvQRUZ2IJ5Td0kqqVNu8i_KEUqKPez7NGPm8oOv3SGAwpmg75yKR3NO7VvCz2YtAVDekO8IO2RSpWHhJPy4">
              </div>
            </td>
            <td class="py-6">
              <span class="font-ubuntu font-bold text-lg text-ink">Collar Relajante Para Gatos Y Perros</span>
              
            </td>
            <td class="py-6 text-center border-x border-ink-line-2 px-4 whitespace-nowrap">
              <span class="font-ubuntu font-medium text-ink">$ 20.000</span>
            </td>
            <td class="py-6 text-center px-4">
              <div class="inline-flex items-center border-2 border-teal-soft rounded-full overflow-hidden bg-white">
                <button class="px-3 py-1 hover:bg-teal-mist transition-colors">
                  <span class="material-symbols-outlined text-lg">delete</span>
                </button>
                <span class="px-4 font-ubuntu font-bold text-ink">1</span>
                <button class="px-3 py-1 hover:bg-teal-mist transition-colors">
                  <span class="material-symbols-outlined text-lg">add</span>
                </button>
              </div>
            </td>
            <td class="py-6 text-center border-l border-ink-line-2 px-4 whitespace-nowrap">
              <span class="font-ubuntu font-extrabold text-ink">$ 20.000</span>
            </td>
            
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Coupon & Update Actions -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
      <div class="flex items-center gap-3 w-full md:w-auto">
        <div class="relative flex-grow md:w-64">
          <input class="w-full px-6 py-3 rounded-full border-2 border-ink-line focus:border-teal-parche focus:ring-4 focus:ring-teal-parche/10 outline-none transition-all font-ubuntu" placeholder="Código de cupón" type="text">
        </div>
        <button class="px-8 py-3 bg-ink text-white font-ubuntu font-bold rounded-full hover:bg-ink-muted active:translate-y-[1px] transition-all">
          Aplicar cupón
        </button>
      </div>
      <button class="px-8 py-3 border-2 border-teal-parche text-ink font-ubuntu font-bold rounded-full hover:bg-teal-mist active:translate-y-[1px] transition-all">
        Actualizar carrito
      </button>
    </div>
  </div>
  <!-- Right Column: Totals (4/12 columns) -->
  <div class="md:col-span-4 sticky top-24">
    <div class="bg-bone p-8 rounded-xl border border-ink-line-2">
      <h2 class="font-ubuntu font-black text-2xl text-ink mb-6">Totales del carrito</h2>
      <div class="flex justify-between py-4 border-b border-ink-line-2">
        <span class="text-ink-muted font-medium">Subtotal</span>
        <span class="text-ink font-ubuntu font-bold">$ 20.000</span>
      </div>
      <div class="flex justify-between py-6">
        <span class="text-ink font-black text-lg">Total</span>
        <span class="text-teal-deep font-black text-2xl">$ 20.000</span>
      </div>
      <button class="w-full py-5 bg-teal-parche text-white font-ubuntu font-black text-lg rounded-full shadow-[0_12px_32px_rgba(121,200,208,0.40)] hover:bg-teal-deep hover:shadow-none active:translate-y-[1px] transition-all mt-4">
        Finalizar compra
      </button>
    </div>
    <p class="text-center text-ink-faint text-xs mt-4">Pago 100% seguro con propósito peludo 🐾</p>
  </div>
</div>
</main>
<!-- Footer -->

<!-- Floating Action Assistance (Apolo) -->
<div class="fixed bottom-6 right-6 z-50">
<button class="w-16 h-16 bg-teal-parche rounded-full shadow-lg flex items-center justify-center hover:scale-110 active:scale-95 transition-all group overflow-hidden">

<div class="absolute -top-12 right-0 bg-white px-4 py-2 rounded-xl shadow-md text-ink text-xs font-bold whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                ¿Te ayudo, parce? 🐾
            </div>
</button>
</div>

        const minusBtn = document.querySelectorAll('button:has(.material-symbols-outlined:contains("remove"))');
        const plusBtn = document.querySelectorAll('button:has(.material-symbols-outlined:contains("add"))');

    </script>






</body></html>
