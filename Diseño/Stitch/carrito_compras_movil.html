<!DOCTYPE html><html class="light" lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Carrito de compras | Parche Peludo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,700&amp;family=Inter:wght@300;400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        teal: {
                            parche: "#79C8D0",
                            deep: "#4AA5AD",
                            soft: "#BEE3E7",
                            mist: "#E8F4F6",
                            ink: "#1E5D64"
                        },
                        ink: {
                            DEFAULT: "#1E2E33",
                            muted: "#5A6B70",
                            faint: "#8E9A9E",
                            line: "rgba(30,46,51,0.10)",
                            line2: "rgba(30,46,51,0.06)"
                        },
                        coral: "#E85D75",
                        marigold: "#FFD166",
                        bone: "#F7F3EC"
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        headline: ["Ubuntu", "sans-serif"],
                        display: ["Ubuntu", "sans-serif"],
                        body: ["Inter", "sans-serif"],
                        label: ["Ubuntu", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; }
        h1, h2, h3, .font-headline { font-family: 'Ubuntu', sans-serif; }
        .shadow-teal-btn { box-shadow: 0 12px 32px rgba(121,200,208,0.40); }
        .glass-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="text-ink antialiased">
<!-- TopAppBar -->

<main class="pt-[96px] pb-24 px-6 max-w-md mx-auto">
<!-- Title -->
<div class="mb-8">
<h1 class="text-3xl font-black tracking-tight mb-2">Carrito de compras</h1>

</div>
<!-- Product Card -->
<div class="bg-white rounded-xl border border-ink-line overflow-hidden mb-6 shadow-md transition-all active:scale-[0.98]">
<div class="flex p-4 gap-4">
<div class="w-24 h-24 rounded-lg bg-teal-mist overflow-hidden flex-shrink-0">
<img alt="Collar Relajante" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLs2uYwoh5ANWJLrE_RwtVf6FVPdQ2f4aO1hbPZp_T4AG7pcx3LI3RCBjrLEM5XZbjUWOr8KFJsvIE7zwBxIdx-T2zavA6ZN_xnxs-EYvLm2Urit9HqumEaGTpd0dQr0kPOLXF0AMObyj9D-g-XMkASHnEty1GfBu7FQl-PDOsnBlfLEMfmLDZi_mwTzJNOamfecfhT8DDTyw6gF1wcmTSPC8Y2NJeS_J7PbUhq_oIw0J_qK4KQyzlU60yc">
</div>
<div class="flex flex-col justify-between flex-grow">
<div>
<div class="flex justify-between items-start">

<button class="text-ink-faint hover:text-coral transition-colors">

</button>
</div>
<h3 class="font-bold text-ink leading-tight mb-1">Collar Relajante Para Gatos Y Perros</h3>
<p class="font-black text-teal-ink">$ 20.000</p>
</div>
<div class="flex items-center justify-between mt-3">
<div class="flex items-center bg-teal-mist rounded-full px-3 py-1 gap-4">
<button class="w-6 h-6 flex items-center justify-center text-teal-ink font-bold"><span class="material-symbols-outlined text-[18px]">delete</span></button>
<span class="text-sm font-bold text-ink">1</span>
<button class="w-6 h-6 flex items-center justify-center text-teal-ink font-bold">+</button>
</div>
<div class="text-right">
<span class="text-[10px] text-ink-muted block uppercase font-bold tracking-tighter">Total</span>
<span class="font-black text-ink">$ 20.000</span>
</div>
</div>
</div>
</div>
</div>
<!-- Coupon Section -->
<div class="bg-bone rounded-xl p-5 mb-8 border border-ink-line2">
<label class="block text-sm font-semibold text-ink mb-3">¿Tienes un cupón?</label>
<div class="flex gap-2">
<input class="flex-grow bg-white border border-ink-line rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-teal-parche focus:border-teal-parche outline-none transition-all" placeholder="Código de cupón" type="text">
<button class="bg-ink text-white font-bold px-4 py-3 rounded-lg text-sm active:scale-95 transition-transform">Aplicar</button>
</div>
</div>
<!-- Action Buttons -->
<div class="grid grid-cols-1 gap-3 mb-10">
<button class="w-full border-2 border-teal-parche text-ink font-bold py-4 rounded-full transition-all hover:bg-teal-mist active:scale-95">
                Actualizar carrito
            </button>
</div>
<!-- Summary -->
<div class="border-t-2 border-ink-line pt-8 mb-12">
<h2 class="text-xl font-bold mb-6">Totales del carrito</h2>
<div class="space-y-4">
<div class="flex justify-between items-center text-ink-muted">
<span class="font-medium">Subtotal</span>
<span class="font-bold">$ 20.000</span>
</div>
<div class="flex justify-between items-center py-4 border-y border-ink-line2">
<span class="text-lg font-black uppercase tracking-tight">Total</span>
<span class="text-2xl font-black text-teal-deep">$ 20.000</span>
</div>
</div>
</div>
<!-- CTA Final -->
<button class="w-full bg-teal-parche text-white font-black text-lg py-5 rounded-full shadow-teal-btn active:scale-95 transition-all mb-4">
            Finalizar compra
        </button>
<p class="text-center text-ink-faint text-xs">Pago 100% seguro con propósito peludo 🐾</p>
</main>
<!-- Footer -->

<!-- Bottom Nav (Mobile Only) -->

<script>
        // Simple micro-interactions
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if(this.classList.contains('active:scale-95')) return;
                this.classList.add('scale-95');
                setTimeout(() => this.classList.remove('scale-95'), 100);
            });
        });
    </script>


</body></html>
